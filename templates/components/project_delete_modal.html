<div class="projects-actions">
    <button type="button"
            class="button button-danger"
            popovertarget="delete-projects-{{ projects.id }}"
            aria-label="Hapus {{ projects.title }}"
            title="Hapus proyek">
        Delete Project
    </button>
</div>

<div id="delete-projects-{{ projects.id }}"
     class="projects-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-projects-title-{{ projects.id }}">
    <button type="button"
            class="projects-delete-modal__backdrop"
            popovertarget="delete-projects-{{ projects.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="projects-delete-modal__content">
        <button type="button"
                class="projects-delete-modal__close"
                popovertarget="delete-projects-{{ projects.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
        <h2 id="delete-projects-title-{{ projects.id }}">Delete Project?</h2>
        <p>
            Are you sure you want to delete?
            <strong>{{ projects.title }}</strong>?
        </p>
        <div class="projects-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-projects-{{ projects.id }}"
                    popovertargetaction="hide">Cancel</button>
            <form method="post" action="{% url 'main:delete_project' projects.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Yes, Delete</button>
            </form>
        </div>
    </div>
</div>
