<form method="post" action="{% url 'main:toggle_star' projects.id %}" class="star-form">
    {% csrf_token %}
    <button type="submit" class="button button-star{% if user in projects.starred_by.all %} is-starred{% endif %}"
        title="{% if projects.starred_by.all %}Dibintangi oleh {{ projects.starred_by.all|join:', ' }}{% else %}Jadilah yang pertama memberi star{% endif %}">
        <span aria-hidden="true">★</span>
        {% if user in projects.starred_by.all %}Unstar{% else %}Star{% endif %}
        <span class="star-count">{{ projects.starred_by.count }}</span>
    </button>
</form>
