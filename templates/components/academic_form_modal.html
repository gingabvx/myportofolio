<div id="add-academic-modal" class="project-form-modal" popover="auto" role="dialog" aria-modal="true"
    aria-labelledby="add-academic-modal-title">
    <button type="button" class="project-form-modal__backdrop" popovertarget="add-academic-modal"
        popovertargetaction="hide" aria-label="Tutup form tambah akademik"></button>
    <div class="project-form-modal__content">
        <button type="button" class="project-form-modal__close" popovertarget="add-academic-modal"
            popovertargetaction="hide" aria-label="Tutup form tambah akademik">×</button>
        <h2 id="add-academic-modal-title">Add Academic Record</h2>

        <form id="academic-form" method="post" action="{% url 'main:create_academic' %}" class="project-form">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                <p class="form-error">{{ error }}</p>
                {% endfor %}
            </div>
            {% endfor %}
            <div class="project-form-modal__actions">
                <button type="button" class="button button-secondary" popovertarget="add-academic-modal"
                    popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button">Add Academic</button>
            </div>
        </form>
    </div>
</div>
