<form method="post" action="{% url 'main:toggle_star_academic' academic.id %}" class="star-form">
    {% csrf_token %}
    <button type="submit" class="button button-star{% if user in academic.starred_by.all %} is-starred{% endif %}"
        title="{% if academic.starred_by.all %}Dibintangi oleh {{ academic.starred_by.all|join:', ' }}{% else %}Jadilah yang pertama memberi star{% endif %}">
        <span aria-hidden="true">★</span>
        {% if user in academic.starred_by.all %}Unstar{% else %}Star{% endif %}
        <span class="star-count">{{ academic.starred_by.count }}</span>
    </button>
</form>
